<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 100vw;
            background-color: rgb(232, 129, 4);
            padding-left: 60px;
            padding: 40px;
            display: flex;gap: 100px;
            font-size: 20px;justify-content: center;
            box-shadow: 3px 3px 8px;
            position: fixed;left: 0px;top: 0px;
            height: 5px;
            
        }
        div>a{
            text-decoration: none;color: rgb(244, 244, 243);

        }
        .logo{
            text-decoration: none;
            color:rgb(83, 10, 10);font-weight: bolder;
            position: absolute;left: 30px;font-size: 40px;top: 20px;
        }
        li{
            position: relative;top: 30px;left: -200px;
            border: 2px black solid;
            list-style: none;
            transition: transform 5s ease-in-out;
            
            /* display: none; */
        }
        li:hover{
            transform: translateY(50px);
            transform: rotate(720deg);
        }
        .profile:hover .li{
            display: inline;
        }
        
        li>a{
            text-decoration: none;
            color: black;
            display: flex;
            padding: 10px 30px;gap: 10px;
        }
        @media all and(max-height:600px) {
            div{
                width: 100vw;
                background-image: linear-gradient(rgb(232, 129, 4),brown);
            }
            a{
                color: aqua;

            }
            
        }
        
    </style>
</head>
<body>
    <nav>
        <div class="navbar" >
            <a href="" class="logo">Logo.</a>
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Contact</a>
            <a href="">Services</a>
            <a href="">Projects</a>
            <a href="" class="profile">Profile</a>
            
        </div>
        <ul>
            <marquee>  <li class="li" style="width: 100px; height: 500px;">
                    <a href="">Home</a>
                    <a href="">About</a>
                    <a href="">Contact</a>
                    <a href="">Services</a>
                    <a href="">Projects</a>

                </li>
                </marquee>
            </ul>
    </nav>
    
</body>
</html>

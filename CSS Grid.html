            50%{background-color: rgb(0, 0, 0);}

        body{
            background-color: rgb(45, 14, 14);
            animation: colorChange 1s ease-in-out infinite;
            color: white;
        }
    body:hover{
        background-color: rgb(1, 80, 7);
    }
    .container{
        display: grid;
        gap: 1px 1px;
        height: fit-content;
        width: fit-content;
        grid-template-columns: 130px 100px 100px 100px 100px 90px 200px ;
        grid-template-rows:70px 50px 50px  50px 50px 50px;
        border: 5px dotted black;
        outline: 5px double black;
        padding: 2px;

    }
    .container:hover{
        background-image: repeating-radial-gradient(white,gray,white,gray,white,gray,white,gray,white,gray,white,gray);
    }
    .child{
        border: 4px double rgb(52, 52, 52); 
        display: flex;
        justify-content: center;
        align-items: center;     
    }
    .cont{
        display: grid;
        margin-top: 30px;
        gap: 10px 20px;
        justify-content:safe;
        align-items: safe;
        border: 2px black solid;
        height: 50vh;
        padding: 10px;
        background-color: ghostwhite;
        grid-template-areas:
         "sidebar navbar navbar navbar" 
         "sidebar navbar navbar navbar"
         "sidebar content footer footer"
         "sidebar content footer footer"
         "sidebar content heroimage heroimage"
         "sidebar content heroimage heroimage"
         "foot foot foot foot"
         "foot foot foot foot"
        ;
    }
    .cont:hover{
        background-color:khaki;
        
    }
    .navbar{
        grid-area: navbar;
        background-color: aqua;
    }
    .navbar:hover,.sidebar:hover,.heroimage:hover,.content:hover,.foot:hover,.footer:hover{
        background-color: rgb(250, 68, 234);
    }
    .sidebar{
        grid-area: sidebar;
        background-color: blueviolet;
    
    }
    .heroimage{
        grid-area: heroimage;
        background-color: yellow;
    }
    .content{
        grid-area: content;
        background-color: red;

    }
    .footer{
        grid-area: footer;
        background-color: chartreuse;
    }
    .foot{
        grid-area: foot;
        background-color: rgb(0, 38, 255);
    }
    .cont>div{
        border: 2px black solid;
        display: grid;
        justify-content: center;
        align-items: center;
    }
    .main{
        display : grid;
        grid-template: "Header Header Header" 100px
            "Heroimage Heroimage Sidebar" 200px
            "Heroimage Heroimage Sidebar" 100px
            "Content Content Sidebar" 100px
            "Foot Foot Sidebar" 100px;
        border: 20px black solid;
        height: fit-content;
        color: white;
        font-weight: bolder;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        font-size: 30px;
        /* opacity: 0.5; */
        /* visibility:hidden; */
    }
    .main > div{
        display: grid;
        justify-content: center;
        align-items: center;
    }
    .Header{
        grid-area: Header;
        background-color: rgb(164, 174, 55);
    }
    .Header:hover,.Sidebar:hover,.Heroimage:hover,.Content:hover,.Foot:hover{
        background-color: rgb(0, 0, 0);
        border: 2px white ;
    }
    .Sidebar{
        grid-area: Sidebar;
        background-color: rgb(77, 40, 28);
    
    }
    .Heroimage{
        grid-area: Heroimage;
        background-color: rgb(103, 50, 139);
    }
    .Content{
        grid-area: Content;
        background-color: rgb(23, 163, 140);

    }
    .Foot{
        grid-area: Foot;
        background-color: rgb(142, 106, 22);
    }
    .repeat{
        display: grid;
        grid-template-columns: repeat(4,1fr);
        grid-template-rows: repeat(2,150px);
        border: 8px double white;
        background-color:black;
        border-left-style: dotted;
        border-radius: 10%;
        border-right-style: dashed;
        justify-content: stretch;
        align-content: center;
    }
    .repeat > div{
        border: 5px ridge gray;
        border-radius: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .number{
        display: grid;
        grid-template-areas: 
        "one one two three three " 
         "one one two eight eight"
         "one one six six six"
         "four five six six six" 
         "four five six six six"
         "four five seven seven seven"
         "four five seven seven seven"
         "four five seven seven seven";
    }
    .number > div {
        border: 2px solid black;
        padding: 20px;
    }
    .one{
        grid-area: one;
    }
     .one{

    }
     .six{

    }
     .seven{

    }
     .eight{

    }
    
</style>

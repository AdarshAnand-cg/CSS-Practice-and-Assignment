<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>
    <style>
        body {
        margin: 0;
        height: 100vh;
        background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSX00vI8YGHK6tJcS869uqHQOyqIOXJq_CSX6IjEKoVuQ&s=10 );
        background-size: contain;
        background-color: black;
        background-repeat:repeat-x;
        display: flex;
        justify-content: center;
        align-items: center;
        }

        .solar-system {
        position: relative;
        width: 500px;
        height: 500px;
        display: flex;
        justify-content: center;
        align-items: center;
        }

        .sun {
        position: absolute;
        width: 90px;
        height: 90px;
        background-image: radial-gradient(orange,yellow,yellow);
        background-color: orange;
        background-size: cover;
        display: flex;
        border-radius: 50%;
        box-shadow: 0 0 20px yellow; 
        }
        .mercury-orbit {
        position: absolute;
        width: 160px;
        height: 160px;
        border: 0.8px dashed rgba(255, 253, 253, 0.4); 
        border-radius: 50%;
        animation: spin 2.41s linear infinite;
        }
        .mercury {
        position: absolute;
        top: 15px; 
        left: 10px;
        width: 25px;
        height: 26px;
        background-image: url(/mercury.png);
        border-radius: 50%;
        box-shadow:0px 0px 10px #c1542a;
        animation: spin 10s linear infinite;
        }

        @keyframes spin {
        from {
            transform: rotate(0deg);
        }
        to {
            transform: rotate(360deg);
        }
    }
        .venus-orbit {
        position: absolute;
        width: 230px;
        height: 230px;
        border: 0.8px dashed rgba(255, 255, 255, 0.4); 
        border-radius: 50%;
        animation: spin 6.15s linear infinite;
        }
        .venus {
        position: absolute;
        top: 15px; 
        left: 25px;
        width: 25px;
        height: 26px;
        background-image: url(/venus.png);
        border-radius: 50%;
        box-shadow:0px 0px 10px #c1542a;
        animation: spin 10s linear infinite;
        }

        @keyframes spin {
        from {
            transform: rotate(0deg);
        }
        to {
            transform: rotate(360deg);
        }
    }


        .earth-orbit {
        position: absolute;
        width: 320px;
        height: 320px;
        border: 0.8px dashed rgba(255, 255, 255, 0.4); 
        border-radius: 50%;
        animation: spin 10s linear infinite;

        }


        .earth {
        position: absolute;
        top: -15px; 
        left: 105px;
        width: 30px;
        height: 31.5px;
        background-image: url(/Earth.png);
        border-radius: 50%;
        box-shadow: 0px 0px 10px #4b9cd3;
        animation: spin 10s linear infinite;
        }

        @keyframes spin {
        from {
            transform: rotate(0deg);
        }
        to {
            transform: rotate(360deg);
        }
        
    }
    .mars-orbit {
        position: absolute;
        width: 400px;
        height: 400px;
        border: 0.8px dashed rgba(255, 255, 255, 0.4);

        }
    .mars {
        position: absolute;
        top: 95px;

        width: 30px;
        height: 30px;
        background-image: url(/Mars.png);
        border-radius: 50%;
        box-shadow:0px 0px 10px #c1542a;
        animation: spin 10s linear infinite;
        }

        @keyframes spin {
        from {

        }
        to {

        }
    }
    .jupiter-orbit {
        position: absolute;

        height: 500px;
        border: 0.8px dashed rgba(255, 255, 255, 0.4);

        }
    .jupiter{
        position: absolute;

        height: 53px;
        background-image:repeating-linear-gradient(#9F856C,#E2E4EB,#8F542F,#C9CACD,#8F542F) ;
        border-radius: 50%;
        box-shadow:0px 0px 20px #c1542a;
        animation: spin 100s linear infinite;
        }

        @keyframes spin {
        from {
            transform: rotate(0deg);
        }
        to {
            transform: rotate(360deg);
        }
    }
    .saturn-orbit {
        position: absolute;
        width: 640px;
        height: 640px;
        border: 0.8px dashed rgba(255, 255, 255, 0.4); 
        border-radius: 50%;
        animation: spin 294.2s linear infinite;
        }
    .ring{
        position: absolute;
        top: 119px; 
        left: 19px;
        width: 87px;
        height: 5px;
        background-color: #797266;
        border-radius: 50%;
        box-shadow:0px 0px 10px #c1542a;
        animation: spin 300s linear infinite;
    }
    @keyframes spin {
        from {
            transform: rotate(0deg);
        }
        to {
            transform: rotate(360deg);
        }
    }
    .saturn{
        position: absolute;
        top: 95px; 
        left: 39px;
        width: 52px;
        height: 53px;
        background-image: url(/saturn.png);

        box-shadow:0px 0px 10px #9F856C;
        }

        @keyframes spin {

        }
        to {

        }
    }
    .uranus-orbit {
        position: absolute;
        width: 750px;
        height: 750px;
        border: 0.8px dashed rgba(255, 255, 255, 0.4); 
        border-radius: 50%;
        animation: spin 837.5s linear infinite;
        }
    .uranus{
        position: absolute;
        top: 218px; 
        left: 5px;
        width: 40px;
        height: 43px;
        background-image:url(/Uranus.png) ;
        border-radius: 50%;
        box-shadow:0px 0px 10px #4b9cd3;
        }

        @keyframes spin {

            transform: rotate(360deg);
        }
    }
    .neptune-orbit {
        position: absolute;

        height: 850px;
        border: 0.8px dashed rgba(255, 255, 255, 0.4); 
        border-radius: 50%;
        animation: spin 1637s linear infinite;
        }
    .neptune{
        position: absolute;
        top: 240px; 
        left: 10px;
        width: 40px;
        height: 43px;
        background-image:url(/neptune.png) ;
        border-radius: 50%;
        box-shadow:0px 0px 10px #4b9cd3;
        }

        @keyframes spin {
        from {
            transform: rotate(0deg);
        }
        to {
            transform: rotate(360deg);
        }
    }

    </style>
</head>
<body>

    <div class="solar-system">
        <div class="sun"></div>
        <div class="mercury-orbit">
            <div class="mercury"></div>
        </div>
        <div class="venus-orbit">

        <div class="earth-orbit">

        <div class="jupiter-orbit">

        <div class="saturn-orbit">

        </div>
        <div class="uranus-orbit">

        <div class="neptune-orbit">

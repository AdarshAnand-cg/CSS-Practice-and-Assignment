<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html{
            font-size: 18px;
        }
        * {
            font-family: algerian;
        }

        input[type="radio"] {
            accent-color: rgb(117, 54, 9);
            width: 20px;height: 15px;
        }

            body {
                background-image: radial-gradient(rgb(216, 153, 111), rgb(82, 31, 1));
            }

            fieldset {
                background-color: rgb(117, 54, 9);
                width: 50vw;

                
            }

            .input {
                background-color: bisque;
                padding: 4px 12px;
                border-radius: 20px;
                width: 300px;
                color: rgb(82, 31, 1);
                font-family: Algerian;
            }

            .input:focus {
                background-color: bisque;
                padding: 2px 12px;
                border-radius: 20px;
                width: 300px;
                color: rgb(82, 31, 1);
                font-family: cursive;
                font-weight: bolder;
                font-size: 1rem;
                border: 2px white groove;
                padding-left: 20px;
            }

            .input1 {
                background-color: bisque;
                padding: 5px 12px;
                border-radius: 20px;
                width: 200px;
                height: 10px;
                font-family: Algerian;
                color: rgb(82, 31, 1);

            }

            form {
                background-color: bisque;
                /* border: 20px solid bisque; */
                display: flex;
                justify-content: center;
                margin: auto;
                margin-top: 30px;
                width: 50vw;
                box-shadow: 0px 0px 30px black;

            }

            legend {
                background-color: bisque;
                position: relative;
                /* left: 35vw; */
                font-size: 25px;
                border-radius: 30px;
                border-top: double 2px rgb(117, 54, 9);
                padding: 10px;
                box-shadow: rgb(117, 54, 9) 0px 0px 4px;
                color: rgb(82, 31, 1);
            }

            .btn {
                padding: 8px 26px;
                border-radius: 20px;
                font-family: cursive;
                font-weight: bolder;
                font-size: 20px;
                background-image: repeating-linear-gradient(brown, rgb(161, 80, 22), rgb(184, 184, 138));
            }

            .btn:hover {
                padding: 8px 26px;
                border-radius: 10px;
                font-family: cursive;
                font-weight: bolder;
                font-size: 20px;
                background-image: repeating-linear-gradient(rgb(82, 31, 1));
                color: white;
                position: relative;
                top: -3px;
            }

            label {
                color: beige;
            }

            .in {
                background-color: rgb(82, 31, 1);


            }
            @media all and (max-width:1000px)  {
                html{
                    font-family: chiller;

                }
                body{
                    background-color: rgb(231, 27, 61);
                }
                fieldset{
                    background-color: rgb(65, 2, 6);
                }
                .btn:hover {
                padding: 8px 26px;
                /* border-radius: 10px; */
                font-family: cursive;
                font-weight: bolder;
                font-size: 20px;
                /* background-image: repeating-linear-gradient(rgb(82, 31, 1)); */
                color: white;
                position: relative;
                top: -8px;

            }
            }
    </style>

</head>

<body>
    <form>
        <fieldset style="margin: 20px; padding: 30px;">
            <legend>Personal Information</legend>
            <label for="name">Username:-</label><input class="input" type="text"
                placeholder="   Enter Your Username"><br><br>
            <label for="Email">Email:-</label><input class="input" type="email"
                placeholder="   Enter Your Email Address"><br><br>
            <label for="Password">Password:-</label><input class="input" type="text"
                placeholder="   Enter Your Password" style="width: 210px;"><br><br>
            <label for="Password">Age:-</label><input class="input1" type="number"
                placeholder="   Enter Your Age"><br><br>
            <label>Gender:</label><input class="in" type="radio" name="gender"><label>Male</label><input class="in"
                type="radio" name="gender"><label name="gender">Female</label><br><br>
            <label for="State">State:-</label><input class="input" type="text" placeholder="   Enter Your State Name"
                style="width: 180px;"><br><br>
            <label for="City">City:-</label><input class="input" type="text" placeholder="   Enter Your City Name"
                style="width: 240px;"><br><br>
            <label for="Choose">Choose Your Board:-</label><input class="in" type="radio" name="choose">
            <label>CBSE</label><input class="in" type="radio" name="choose"><label>State Board</label><br><br>
            <label>Enter the Class 10th Marks in Percent:- </label><input class="input" type="text"
                placeholder="Eg:-94.0%" style="width: 70px;"><br><br>
            <label>Enter the Class 12th Marks in Percent:- </label><input class="input" type="text"
                placeholder="Eg:-94.0%" style="width: 70px;"><br><br>
            <button type="submit" class="btn">Submit</button>


        </fieldset>
    </form>

</body>

</html>

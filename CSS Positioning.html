<!DOCTYPE html>

<head>

    <title>Document</title>
    <style>
        body{

            );

        .cont{

            /* background-color: rgb(7, 7, 7); */

            height:85px;

            left: 620px;

            border-radius: 60%;

        }
        .eye1{

            height: 30px;

            left: 570px;
        }
        .eye2{

            height: 30px;
            border-radius: 60%;
            position: absolute;

            left: 800px;
        }
        .body{
            border: 8px solid black;
            height: 450px;
            width:950px;
            border-radius: 50%;
            border-bottom-left-radius: 10%;
            border-bottom-right-radius: 0%;
            background-color: rgb(221, 221, 212);
            position:relative;
            top:470px;
            z-index:-1;
            left:287px;
            top: 430px;
            
        }
    </style>
</head>
<body>
    <!-- <div class="body"></div> -->
        <div class="cont"></div>

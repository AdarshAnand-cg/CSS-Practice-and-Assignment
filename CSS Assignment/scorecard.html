<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: gray;
            
        }
        *{
            font-family: sans-serif;
        }
        #cont{
            background-image: url(https://t4.ftcdn.net/jpg/14/65/38/61/360_F_1465386104_xj6Fz7wQbxt9zDogxBcn98tecJ7EtfDv.jpg);
            background-size: cover;
            background-repeat: no-repeat;
            width:55vw;
            margin: auto;
            border: white 1px solid;
            border-radius: 0px;
            outline: white 3px solid;
            box-shadow: 0px 0px 2px white;
        }
        
        .super-over-match{
            display: flex;
            justify-content: center;
            padding: 20px 0px;
            width: 100%;
            color: white;
            font-weight: 1000;
        }
        .score{
            display: flex;
            border-radius: 50%;
            height: 20px;width: 20px;
            /* font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; */
            border: white solid 2px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-left: 5px;
            background-color: white;
            font-weight: 1000;
            font-size: 14px;
        }
        .over{
            display: flex;
            justify-content: center;
            padding: 10px 10px;
        }
        .ind-pak{
            display: flex;
            justify-content: center;
            gap: 50px;
            width: 100%;
        }
        .ind{
            display: flex;
            border-radius: 10px;
            justify-content: center;
            background-color: #185194;
            font-size: 40px;
            padding: 10px;
            color: white;
            font-weight: 600;
        }
        .pak{
            display: flex;
            justify-content: center;
            font-size: 40px;
            padding: 10px;
            font-weight: 600;
            color: white;
        }
        .scorecard{
            display: flex;
            justify-content: center;
            font-size: 15px;
            font-weight: 1000;
            color: white;
        }
        .ind-cont{
            background-color: #185194;
            height: 150px;width: 200px;
            border-radius: 10px;
            justify-content: center;align-items: center;
        }
        .pak-cont{
            background-color: #459F30;
            width: 200px;
            border-radius: 10px;
        }
        .bat-resume{
            display: flex;
            justify-content: center;
            padding: 20px 0px;
            width: 100%;
            gap: 30px;
        }
        .mini-cont{
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .bat{
            background-color:#F5B83C ;
            /* padding: 4px; */
            border-radius: 10px;
            border: double white 4px;
            font-weight: 1000;
        }
        .resume{
            background-color: #185194;
            border-radius: 10px;
            border: double white 4px;
            font-weight: 1000;

        }
    </style>

</head>
<body>
    <div id="cont">
        <div class="super-over-match"><img src="/Cricket Batter Silhouette with Ball.png" height="40px" width="50px"> SUPER<br>OVER</div>
        <div class="ind-pak">
            <div class="ind-cont">
                <div class="ind">IND</div>
                <div class="over">
                    <div class="score">4</div>
                    <div class="score">3</div>
                    <div class="score">2</div>
                    <div class="score">6</div>
                    <div class="score">6</div>
                    <div class="score">6</div>
                </div>
                <div class="scorecard">27/0</div>
            </div>
            <div class="pak-cont">
                <div class="pak">PAK</div>
                <div class="over">
                    <div class="score">2</div>
                    <div class="score">4</div>
                    <div class="score">0</div>
                    <div class="score">3</div>
                    <div class="score">1</div>
                    <div class="score">4</div>
                </div>
                <div class="scorecard">14/0</div>
            </div>
        </div>

        </div>
    </div>
    
</body>
</html>

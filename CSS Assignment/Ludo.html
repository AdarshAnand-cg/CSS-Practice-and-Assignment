<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Board</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            background-color: #f4f4f4;
        }

        /* Complete Ludo board */

        .board {
            width: min(95vw, 500px);
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid black;
            background-color: white;
        }

        /* Top, middle and bottom sections */

        .top-section,
        .bottom-section {
            height: 40%;
            width: 100%;
            display: flex;
            flex-shrink: 0;
        }

        .middle-section {
            height: 20%;
            width: 100%;
            display: flex;
            flex-shrink: 0;
        }

        /* Four home areas */

        .home {
            width: 40%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .red-home {
            background-color: red;
        }

        .green-home {
            background-color: green;
        }

        .blue-home {
            background-color: blue;
        }

        .yellow-home {
            background-color: yellow;
        }

        /* White box inside each home */

        .home-box {
            width: 66.67%;
            height: 66.67%;
            background-color: white;
            display: flex;
            flex-direction: column;
        }

        .token-row {
            width: 100%;
            height: 50%;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        /* Player tokens */

        .token {
            width: 25%;
            aspect-ratio: 1 / 1;
            border: 3px solid;
            border-radius: 50%;
            background-color: white;
            flex-shrink: 0;
        }

        .red-token {
            border-color: red;
        }

        .green-token {
            border-color: green;
        }

        .blue-token {
            border-color: blue;
        }

        .yellow-token {
            border-color: yellow;
        }

        /* Path cells */

        .cell {
            flex: 1;
            min-width: 0;
            min-height: 0;
            border: 0.5px solid #111;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            color: black;

        }

        .green-cell {
            background-color: green;
        }

        .red-cell {
            background-color: red;
        }

        .blue-cell {
            background-color: blue;
        }

        .yellow-cell {
            background-color: yellow;
        }

        .star {
            font-size:22px 
        }

        /* Vertical paths */

        .vertical-path {
            width: 20%;
            height: 100%;
            display: flex;
            flex-shrink: 0;
        }

        .path-column {
            height: 100%;
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        /* Horizontal paths */

        .horizontal-path {
            width: 40%;
            height: 100%;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .path-row {
            width: 100%;
            flex: 1;
            min-height: 0;
            display: flex;
        }

        /* Center of the board */

        .board-center {
            width: 20%;
            height: 100%;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            background-color: white;
        }

        .triangle {
            position: absolute;
        }

        .green-triangle {
            top: 0;
            left: 0;
            width: 50%;
            height: 50%;
            position: relative;left: 50px;
            z-index: 1;
            background-color: green;
        }

        .yellow-triangle {
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            background-color: yellow;
        }

        .red-triangle {
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background-color: red;
        }

        .blue-triangle {
            bottom: 0;
            left: 0;
            width: 50%;
            height: 50%;
            background-color: blue;
        }

        /* Small screens */

        @media (max-width: 350px) {
            .token {
                border-width: 2px;
            }

            .cell {
                border-width: 0.4px;
            }
        } 
    </style>
</head>

<body>

    <div class="board">

        <!-- TOP SECTION -->

        <div class="top-section">

            <!-- Red home -->

            <div class="home red-home">
                <div class="home-box">
                    <div class="token-row">
                        <div class="token red-token"></div>
                        <div class="token red-token"></div>

                    <div class="token-row">
                        <div class="token red-token"></div>
                        <div class="token red-token"></div>
                    </div>
                </div>
            </div>

            <!-- Green path -->

            <div class="vertical-path">

                <div class="path-column">
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell green-cell">
                        <span class="star">★</span>
                    </div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                </div>

                <div class="path-column">
                    <div class="cell"></div>
                    <div class="cell green-cell"></div>
                    <div class="cell green-cell"></div>
                    <div class="cell green-cell"></div>
                    <div class="cell green-cell"></div>
                    <div class="cell green-cell"></div>
                </div>

                <div class="path-column">
                    <div class="cell"></div>
                    <div class="cell green-cell">
                        <span class="star">★</span>
                    </div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                </div>

            </div>

            <!-- Green home -->

            <div class="home green-home">
                <div class="home-box">
                    <div class="token-row">
                        <div class="token green-token"></div>
                        <div class="token green-token"></div>
                    </div>

                    <div class="token-row">
                        <div class="token green-token"></div>
                        <div class="token green-token"></div>
                    </div>
                </div>
            </div>

        </div>

        <!-- MIDDLE SECTION -->

        <div class="middle-section">

            <!-- Red path -->

            <div class="horizontal-path">

                <div class="path-row">
                    <div class="cell"></div>
                    <div class="cell red-cell">
                        <span class="star">★</span>
                    </div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                </div>

                <div class="path-row">
                    <div class="cell"></div>
                    <div class="cell red-cell"></div>
                    <div class="cell red-cell"></div>
                    <div class="cell red-cell"></div>
                    <div class="cell red-cell"></div>
                    <div class="cell red-cell"></div>
                </div>

                <div class="path-row">
                    <div class="cell"></div>
                    <div class="cell"></div>

                    <div class="cell"></div>

            </div>

            <!-- Four-color center -->

            <div class="board-center">
                <div class="triangle green-triangle"></div>
                <div class="triangle yellow-triangle"></div>

            </div>

            <!-- Yellow path -->

            <div class="horizontal-path">

                <div class="path-row">
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell yellow-cell">
                        <span class="star">★</span>
                    </div>
                    <div class="cell"></div>
                </div>

                <div class="path-row">
                    <div class="cell yellow-cell"></div>
                    <div class="cell yellow-cell"></div>
                    <div class="cell yellow-cell"></div>
                    <div class="cell yellow-cell"></div>
                    <div class="cell yellow-cell"></div>
                    <div class="cell"></div>
                </div>

                <div class="path-row">
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell yellow-cell">
                        <span class="star">★</span>
                    </div>
                    <div class="cell"></div>
                </div>

            </div>

        </div>

        <!-- BOTTOM SECTION -->

        <div class="bottom-section">

            <!-- Blue home -->

            <div class="home blue-home">
                <div class="home-box">
                    <div class="token-row">
                        <div class="token blue-token"></div>
                        <div class="token blue-token"></div>
                    </div>

                    <div class="token-row">
                        <div class="token blue-token"></div>
                        <div class="token blue-token"></div>
                    </div>
                </div>
            </div>

            <!-- Blue path -->

            <div class="vertical-path">

                <div class="path-column">
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell"></div>
                    <div class="cell blue-cell">
                        <span class="star">★</span>
                    </div>
                    <div class="cell"></div>
                </div>

                <div class="path-column">
                    <div class="cell blue-cell"></div>
                    <div class="cell blue-cell"></div>
                    <div class="cell blue-cell"></div>
                    <div class="cell blue-cell"></div>
                    <div class="cell blue-cell"></div>
                    <div class="cell"></div>
                </div>

                <div class="path-column">
                    <div class="cell"></div>

                    </div>

            </div>

            <!-- Yellow home -->

            <div class="home yellow-home">
                <div class="home-box">
                    <div class="token-row">
                        <div class="token yellow-token"></div>
                        <div class="token yellow-token"></div>
                    </div>

                    <div class="token-row">
                        <div class="token yellow-token"></div>
                        <div class="token yellow-token"></div>

            </div>

        </div>

    </div>

</body>
</html>
